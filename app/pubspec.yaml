name: taptether
description: Local-first universal remote for trusted personal devices.
publish_to: none
version: 0.7.0+60
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  cryptography: ^2.9.0
  dartssh2: ^4.1.0
  file_picker: ^10.3.3
  archive: ^4.0.7
  xml: ^6.6.1
  mobile_scanner: ^7.1.4
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.3.1
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  network_info_plus: ^6.1.4
  connectivity_plus: ^6.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/agents/
    - assets/branding/
